# Pinned upstream sources for CrescendoKit's binary components.
#
# The build scripts refuse to build anything not recorded here: the version
# pins what gets downloaded, and the SHA-256 is verified against the
# downloaded tarball BEFORE extraction, fail-closed. FFmpeg tarballs are
# additionally verified against the detached GPG signature published on
# ffmpeg.org, using the release signing key committed at
# Keys/ffmpeg-signing-key.asc (fingerprint
# FCF986EA15E6E293A5644F10B4322F04D67658D8, cross-checked against ffmpeg.org).
# TagLib publishes no release signatures, so its anchor is the hash pin.
#
# This file is the ONLY source of truth for what gets built: the scripts
# take no version argument. To update a dependency:
#   1. Run the script with --check-updates to discover the latest version.
#   2. Set the new version here and CLEAR its SHA256 line.
#   3. Run the script: it downloads, verifies what it can (FFmpeg's GPG
#      signature always), prints the tarball's SHA-256, and stops.
#   4. Adopt the printed hash here, commit the change for review, and rerun
#      to build. Never copy a hash you have not deliberately chosen.

FFMPEG_VERSION=9.0.1
FFMPEG_SHA256=cf38e0e28c7e5605942c4a77755349b0145804a397af37eb1fb4c77cb237f635

TAGLIB_VERSION=2.3.1
TAGLIB_SHA256=a19d90e6fd41d09a0281ec0fe762d51491d7a6ccffc923c4f7868c5e647ca230
